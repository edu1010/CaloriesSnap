name: calorie_snap
description: CalorieSnap - offline approximate calorie logging from meal photos.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.2
  image: ^4.5.4
  image_picker: ^1.2.1
  intl: ^0.20.2
  mobile_scanner: ^6.0.11
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.4.0+3
  table_calendar: ^3.2.0
  tflite_flutter: ^0.12.1
  llamadart: ^0.21.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/food_classifier.tflite
    - assets/models/food_classifier_labels.csv
    - assets/models/food101_general.tflite
    - assets/models/food101_general_labels.csv
    - lib/data/local/nutrition_database.json
    - lib/data/local/food101_nutrition.json
    - lib/data/local/common_foods_es.json
    - lib/data/local/nutrition_products_es.json
    - lib/data/local/ingredients_es.json

# On-device vision: ship only the llama.cpp runtime. LiteRT-LM and
# the Vulkan module add ~60 MB to the APK and are not used on phones.
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
      llamadart_native_backends:
        platforms:
          android: [cpu]
